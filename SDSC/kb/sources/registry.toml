# sources/registry.toml — THE list of external documentation this KB depends on.
#
# Human-edited. `tools/ingest.py` reads it, mirrors every `mode = "mirror"` entry into
# sources/<group>/<id>.md (with provenance frontmatter), and writes sources/lock.json + INDEX.md.
# Full conventions: sources/README.md
#
# Per-source keys (anything set in [groups.<name>] is inherited):
#   id        unique, kebab-case, prefixed with the group  (required)
#   group     folder under sources/                         (required)
#   title     human title                                   (required)
#   mode      "mirror" (default) | "link" (catalogue only; consult online)
#   status    "auto" (default: regenerate each run) | "fixed" (hand-repaired; never overwritten)
#   kind      "github" | "gitlab" | "url"
#   repo/ref  repository + branch/tag to track (resolved to a commit SHA in lock.json)
#   prefix    path prefix inside the repo; `path` is appended
#   format    "md" | "mdx" | "html"
#   url       canonical human-readable page (for kind="url" also what is fetched)
#   url_template  group-level; "{page}" = path without extension (or explicit `page`)
#   link_base     prefix for root-relative links like "/docs/x"
#   selector  CSS selector for the content root of HTML pages (default <main>)
#   license   as declared upstream ("none declared" = local reference copy only; never commit the copy)
#   note      one line shown in INDEX.md

# =============================================================================== groups
[groups.opencode-v1]
title = "OpenCode V1 (opencode-ai 1.18.x) — what hpcgpt-cli/SDSC targets today"
description = "Pinned to the latest V1 release tag. The SDSC deployment (agents/, skills/, TUI plugins, `provider`/`npm`/`options` config) is written against V1."
kind = "github"
repo = "anomalyco/opencode"
ref = "v1.18.32"
prefix = "packages/web/src/content/docs/"
format = "mdx"
url_template = "https://opencode.ai/docs/{page}"
link_base = "https://opencode.ai"
license = "MIT"

[groups.opencode-v2]
title = "OpenCode V2 (@opencode/cli 2.x, released 2026-09-11)"
description = "V2 keeps V1 config/agents/skills working but REQUIRES porting plugins (new plugin API) and moves tui.json -> cli.json. Mirror the pages that matter for a future migration."
kind = "github"
repo = "anomalyco/opencode"
ref = "v2.0.18"
prefix = "services/www/src/docs/content/"
format = "mdx"
url_template = "https://opencode.ai/v2/docs/{page}"
link_base = "https://opencode.ai"
license = "MIT"

[groups.agentskills]
title = "Agent Skills open standard (agentskills.io)"
description = "The SKILL.md format OpenCode, Claude Code and others implement. Served as Markdown with Mintlify components (<Card>), so normalised as MDX."
kind = "url"
format = "mdx"
link_base = "https://agentskills.io"
license = "Apache-2.0"

[groups.expanse]
title = "SDSC Expanse — official user documentation"
description = "The SDSC user guide is the authority for partitions, charging and storage; training repos add worked examples."
license = "none declared"

[groups.slurm]
title = "Slurm (SchedMD) — upstream reference"
description = "Man pages change with the installed Slurm version; consult online (check `sinfo --version` on Expanse)."

[groups.nrp]
title = "National Research Platform (Nautilus) — user docs"
description = "Source: gitlab.nrp-nautilus.io/prp/nrp-site (Starlight MDX). Tracks `main`; commit pinned per fetch in lock.json."
kind = "gitlab"
host = "https://gitlab.nrp-nautilus.io"
repo = "prp/nrp-site"
ref = "main"
prefix = "src/content/docs/Documentation/userdocs/"
url_template = "https://nrp.ai/documentation/userdocs/{page}/"
link_base = "https://nrp.ai"
license = "none declared"

[groups.hpcgpt]
title = "hpcGPT project, LLM providers and prior art"
description = "Upstream repos, provider consoles and references the SDSC team cites (mostly link-only)."

[groups.hpcenv]
title = "Generic HPC software environments (modules, conda) — multi-site docs"
description = "Upstream tool docs and other centers' guides used to write the site-agnostic hpc-modules and hpc-conda skills. Link-only; each note says why it was used."

[groups.evals]
title = "Evaluating agents and Agent Skills — papers and guides"
description = "Sources behind evaluation/skill-evaluation-metrics.md. Link-only; each note says why it was used. Numbers flagged unverified there were seen only in abstracts or snippets."

